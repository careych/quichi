<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quichi — Learn Chinese vocabulary, HSK 1–9</title>
  <meta name="description" content="Free Chinese vocabulary trainer for HSK 1 to HSK 9: flashcards with spaced repetition, quizzes, audio and stroke order for 10,000+ words.">
  <meta name="theme-color" content="#e5484d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e5484d'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='PingFang SC,Noto Sans SC,sans-serif'%3E趣%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Quichi home">
        <span class="brand-mark" aria-hidden="true">趣</span>
        <span class="brand-name">Quichi</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/stats" data-nav="stats">Progress</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="topbar-right">
        <span class="chip chip-streak" id="streak-chip" title="Day streak">🔥 <b>0</b></span>
        <button class="icon-btn" data-act="toggle-theme" aria-label="Switch between light and dark theme" title="Light / dark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="home"><span aria-hidden="true">🏠</span>Home</a>
    <a href="#/stats" data-nav="stats"><span aria-hidden="true">📈</span>Progress</a>
    <a href="#/settings" data-nav="settings"><span aria-hidden="true">⚙️</span>Settings</a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;text-align:center">Quichi needs JavaScript to run.</p></noscript>

  <script src="data/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
