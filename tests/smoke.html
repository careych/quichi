<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <title>Quichi smoke test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Open this file in a browser: it drives the real app through its main flows
       using a separate storage key, then prints PASS/FAIL lines below. -->
  <pre id="out" style="padding:16px;white-space:pre-wrap">running…</pre>
  <header class="topbar"><span class="chip" id="streak-chip"><b>0</b></span></header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script>
    window.QUICHI_STORE_KEY = 'quichi.test';
    localStorage.removeItem('quichi.test');
  </script>
  <script src="data/index.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async function () {
      const lines = [];
      let failed = 0;
      const check = (name, ok, detail) => { if (!ok) failed++; lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${detail === undefined ? '' : ' — ' + detail}`); };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = async (fn, label) => {
        for (let i = 0; i < 100; i++) { if (fn()) return true; await sleep(30); }
        check(`timeout waiting for ${label}`, false);
        return false;
      };
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      const go = (hash) => { location.hash = hash; };
      const stored = () => JSON.parse(localStorage.getItem('quichi.test') || '{"cards":{},"log":{}}');
      const Q = window.__quichi;

      try {
        // --- scheduling
        let c = { l: '1', iv: 0, ef: 2.5, r: 0, x: 0, due: 100 };
        c = Q.schedule(c, 2, 100); check('good #1 -> 1 day', c.iv === 1 && c.due === 101 && c.r === 1, JSON.stringify(c));
        c = Q.schedule(c, 2, 101); check('good #2 -> 3 days', c.iv === 3 && c.due === 104, JSON.stringify(c));
        c = Q.schedule(c, 2, 104); check('good #3 -> iv*ease', c.iv === 8, JSON.stringify(c));
        c = Q.schedule(c, 3, 112); check('easy grows faster and raises ease', c.iv === 26 && c.ef === 2.65, JSON.stringify(c));
        c = Q.schedule(c, 0, 138); check('again resets, due same day, lapse counted', c.iv === 0 && c.due === 138 && c.r === 0 && c.x === 1 && c.ef === 2.45, JSON.stringify(c));
        let big = { l: '1', iv: 300, ef: 3, r: 9, x: 0, due: 0 };
        check('interval is capped', Q.schedule(big, 3, 0).iv === 365);
        check('ease never drops below 1.3', Q.schedule({ l: '1', iv: 5, ef: 1.3, r: 3, x: 0, due: 0 }, 0, 0).ef === 1.3);
        check('normalizeState drops broken cards', Object.keys(Q.normalizeState({ cards: { a: { l: '99', due: 1 }, b: { l: '2', due: 5 }, c: null } }).cards).join() === 'b');

        // --- home
        await until(() => $$('.level-card').length, 'home');
        check('home shows 7 level cards', $$('.level-card').length === 7, $$('.level-card').length);

        // --- level list + search
        go('#/level/1');
        await until(() => $$('#list .row').length, 'level list');
        check('level list paginates', $$('#list .row').length >= 80 && $$('#list .row').length < 506, $$('#list .row').length);
        const input = $('#lsearch');
        const search = async (q) => { input.value = q; input.dispatchEvent(new Event('input', { bubbles: true })); await sleep(250); return [...$$('#list .row .row-hz')].map((e) => e.textContent); };
        let r = await search('xiexie'); check('toneless pinyin search finds 谢谢', r[0] === '谢谢', r.slice(0, 3).join(' '));
        r = await search('谢谢'); check('hanzi search finds 谢谢', r[0] === '谢谢', r.slice(0, 3).join(' '));
        r = await search('teacher'); check('english search finds 老师', r.includes('老师'), r.slice(0, 5).join(' '));
        r = await search('zzzzqq'); check('no-match shows empty state', r.length === 0 && !!$('#list .empty'));
        await search('');

        // --- word modal
        $('#list .row').click();
        check('word modal opens', !!$('.modal .defs li'));
        $('[data-act="mark-known"]').click();
        check('mark-known creates a mastered card', Object.values(stored().cards).some((k) => k.iv === 30));
        $('[data-act="reset-word"]').click();
        check('reset-word removes the card', Object.keys(stored().cards).length === 0);
        $('[data-act="modal-x"]').click();
        check('modal closes', !$('.modal'));

        // --- learn session
        go('#/learn/1');
        await until(() => $('[data-act="next-intro"]'), 'learn session');
        let intros = 0;
        while ($('[data-act="next-intro"]')) { $('[data-act="next-intro"]').click(); intros++; if (intros > 50) break; }
        check('learn shows 10 intro cards', intros === 10, intros);
        let graded = 0;
        while ($('[data-act="reveal"]') && graded < 50) {
          $('[data-act="reveal"]').click();
          const g = graded === 0 ? 0 : 2; // fail the first card once to exercise the requeue
          $(`[data-act="grade"][data-g="${g}"]`).click();
          graded++;
        }
        check('"again" requeues the card (11 gradings for 10 words)', graded === 11, graded);
        check('session summary is shown', !!$('.done'));
        let st = stored();
        check('10 cards saved', Object.keys(st.cards).length === 10, Object.keys(st.cards).length);
        check('all cards due tomorrow', Object.values(st.cards).every((k) => k.iv === 1));
        check('activity logged: 10 learned + 1 marked known earlier', Object.values(st.log)[0].n === 11, JSON.stringify(st.log));
        check('streak chip shows 1', $('#streak-chip b').textContent === '1', $('#streak-chip b').textContent);

        // --- review: nothing due yet, then force-due
        go('#/review/1');
        await until(() => $('.empty'), 'empty review');
        check('review is empty when nothing is due', /Nothing to review/.test($('.empty').textContent));
        st = stored(); Object.values(st.cards).forEach((k) => { k.due -= 5; });
        localStorage.setItem('quichi.test', JSON.stringify(st));

        // --- quiz (all four modes)
        for (const mode of ['meaning', 'hanzi', 'pinyin', 'listen']) {
          go('#/'); await sleep(60);
          go('#/quiz/1');
          await until(() => $('[data-act="quiz-start"]'), 'quiz setup');
          const btn = $(`[data-act="quiz-start"][data-mode="${mode}"]`);
          if (!btn) { lines.push(`SKIP quiz ${mode} (no speech synthesis here)`); continue; }
          btn.click();
          await until(() => $('[data-act="quiz-pick"]'), `quiz ${mode}`);
          let answered = 0, four = true, distinct = true;
          while ($('[data-act="quiz-pick"]') && answered < 20) {
            const opts = [...$$('[data-act="quiz-pick"] .txt')].map((e) => e.textContent);
            if (opts.length !== 4) four = false;
            if (new Set(opts).size !== opts.length) distinct = false;
            $('[data-act="quiz-pick"]').click();
            if ($$('.opt.right').length !== 1) four = false;
            $('[data-act="quiz-next"]').click();
            answered++;
          }
          check(`quiz ${mode}: 10 questions, 4 distinct options, one correct`, answered === 10 && four && distinct, `${answered} ${four} ${distinct}`);
          check(`quiz ${mode}: summary shown`, !!$('.done'));
        }

        // --- stats + settings
        go('#/stats');
        await until(() => $('.chart'), 'stats');
        check('stats chart has 14 days', $$('.chart .col').length === 14);
        check('today bar is non-zero', !$$('.chart .col')[13].classList.contains('zero'));
        go('#/settings');
        await until(() => $('[data-act="set"]'), 'settings');
        $('[data-act="set"][data-key="script"][data-value="t"]').click();
        check('script setting persists', stored().settings.script === 't');
        go('#/level/1');
        await until(() => $$('#list .row').length, 'level list (traditional)');
        r = await (async () => { $('#lsearch').value = 'meiguanxi'; $('#lsearch').dispatchEvent(new Event('input', { bubbles: true })); await sleep(250); return [...$$('#list .row .row-hz')].map((e) => e.textContent); })();
        check('traditional script is displayed', r[0] === '沒關係', r.slice(0, 2).join(' '));
      } catch (e) {
        check('no exception', false, e && e.stack || e);
      }
      localStorage.removeItem('quichi.test');
      lines.push(failed ? `\n${failed} FAILED` : '\nALL PASSED');
      document.getElementById('out').textContent = lines.join('\n');
      document.title = failed ? 'FAILED' : 'PASSED';
    })();
  </script>
</body>
</html>
